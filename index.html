<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bagel+Fat+One&family=Jua&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,a{outline:none!important;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  button:focus,button:focus-visible,button:active,a:focus,a:focus-visible,a:active{outline:none!important}

  body{font-family:'Pretendard',-apple-system,sans-serif;background:#ffe9ec;color:#2a1a1a;min-height:100vh;padding:20px;
    background-image:radial-gradient(circle at 20% 30%,#ffc8d1 0%,transparent 40%),radial-gradient(circle at 80% 70%,#ffd4a8 0%,transparent 40%)}
  .container{max-width:640px;margin:auto;background:#fffaf5;border:3px solid #2a1a1a;border-radius:24px;padding:40px 30px;box-shadow:8px 8px 0 #2a1a1a}

  .subtitle{text-align:center;color:#8a5a5a;margin-bottom:30px;font-size:14px}
  .badge{display:inline-block;background:#ff4d6d;color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:bold;margin-bottom:16px;transform:rotate(-2deg);font-family:'Jua',sans-serif;letter-spacing:1px}
  .age-gate,.quiz,.result,.loading{display:none}
  .active{display:block}
  .question{margin-bottom:24px}
  .q-num{color:#ff4d6d;font-weight:bold;font-size:14px;margin-bottom:8px;font-family:'Bagel Fat One',sans-serif;letter-spacing:1px}
  .q-text{font-family:'Black Han Sans','Jua',sans-serif;font-size:24px;margin-bottom:18px;line-height:1.35;color:#2a1a1a}
  .options{display:flex;flex-direction:column;gap:10px}

  /* ===== 옵션 버튼 (기본 + selected만 정의) ===== */
  .option{background:#fff;border:2px solid #2a1a1a;border-radius:12px;padding:14px 18px;cursor:pointer;font-size:15px;text-align:left;
    transition:background .15s,color .15s,transform .15s,box-shadow .15s;font-family:inherit;color:#2a1a1a;transform:translate(0,0);box-shadow:none}
  .option.selected{background:#ff4d6d;color:#fff;transform:translate(-2px,-2px);box-shadow:4px 4px 0 #2a1a1a;border-color:#2a1a1a}
  .option:disabled{cursor:not-allowed;pointer-events:none}

  .progress{height:8px;background:#ffd4dc;border-radius:10px;margin-bottom:30px;overflow:hidden;border:2px solid #2a1a1a}
  .progress-bar{height:100%;background:#ff4d6d;transition:width .3s}

  /* ===== 메인 버튼 ===== */
  .btn{background:#2a1a1a;color:#fff;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px;font-family:'Jua',sans-serif;letter-spacing:1px;transition:transform .15s,box-shadow .15s;transform:translate(0,0);box-shadow:none}

  /* ===== 네비게이션 버튼 ===== */
  .nav-buttons{display:flex;gap:10px;margin-top:20px}
  .nav-btn{flex:1;padding:14px 18px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;font-family:'Jua',sans-serif;letter-spacing:1px;transition:transform .15s,box-shadow .15s,background .15s,color .15s;border:2px solid #2a1a1a;-webkit-appearance:none;appearance:none;transform:translate(0,0);box-shadow:none}
  .nav-btn.prev{background:#fffaf5;color:#2a1a1a;flex:0 0 38%}
  .nav-btn.next{background:#2a1a1a;color:#fff;border-color:#2a1a1a}
  .nav-btn:disabled{background:#e8d8d8!important;color:#aaa!important;border:2px solid #c8b8b8!important;cursor:not-allowed;box-shadow:none!important;transform:none!important}

  /* ===== hover 효과는 진짜 마우스 환경에서만 작동 (모바일 잔상 차단) ===== */
  @media (hover:hover) and (pointer:fine){
    .option:hover:not(.selected):not(:disabled){background:#ffe9ec;transform:translate(-2px,-2px);box-shadow:4px 4px 0 #2a1a1a}
    .btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #ff4d6d}
    .nav-btn:not(:disabled):hover{transform:translate(-2px,-2px)}
    .nav-btn.next:not(:disabled):hover{box-shadow:4px 4px 0 #ff4d6d}
    .nav-btn.prev:not(:disabled):hover{box-shadow:4px 4px 0 #2a1a1a}
    .detail-link:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #ff4d6d}
    .challenge .detail-link:hover{box-shadow:4px 4px 0 #2a1a1a}
  }

  /* ===== 클릭 직후만 살짝 눌리는 효과 (잔상 X) ===== */
  .btn:active,.nav-btn:not(:disabled):active,.option:not(.selected):not(:disabled):active,.detail-link:active{
    transform:translate(0,0);box-shadow:none
  }

  /* ===== 로딩 ===== */
  .loading{text-align:center;padding:40px 0}
  .loading-emoji{font-size:80px;display:inline-block;animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .loading-title{font-family:'Black Han Sans','Jua',sans-serif;font-size:30px;margin:20px 0 10px;color:#2a1a1a}
  .loading-message{font-size:18px;color:#8a5a5a;margin-bottom:12px;transition:opacity .2s;font-family:'Jua',sans-serif}
  .loading-funny{font-size:14px;color:#ff4d6d;font-style:italic;transition:opacity .2s}
  .dots{display:inline-flex;gap:6px;margin-top:20px}
  .dot{width:10px;height:10px;border-radius:50%;background:#ff4d6d;animation:pulse 1.4s infinite}
  .dot:nth-child(2){background:#ffc8d1;animation-delay:.2s}
  .dot:nth-child(3){background:#ffd4a8;animation-delay:.4s}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}

  /* ===== 결과 카드 ===== */
  .result-main,.challenge{background:#fff;border:3px solid #2a1a1a;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:6px 6px 0 #2a1a1a}
  .challenge{background:#fff8e1;box-shadow:6px 6px 0 #ff4d6d}
  .position-image{width:100%;height:280px;background:#fff;border:3px solid #2a1a1a;border-radius:12px;overflow:hidden;box-shadow:4px 4px 0 #2a1a1a;margin-bottom:18px}
  .position-image img{width:100%;height:100%;object-fit:cover}
  .card-title-area{margin-bottom:14px}
  .result-tag{display:inline-block;background:#ff4d6d;color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:bold;margin-bottom:8px;font-family:'Jua',sans-serif;letter-spacing:1px}
  .challenge .result-tag{background:#2a1a1a}
  .card-title-area h2{font-family:'Black Han Sans','Jua',sans-serif;font-size:30px;color:#2a1a1a;line-height:1.2;margin-bottom:6px}
  .card-comment{font-size:14px;color:#8a5a5a;font-style:italic}
  .result-detail{font-size:16px;line-height:1.6;margin-bottom:14px;color:#2a1a1a}
  .reason-box{background:#ffe9ec;border:2px dashed #ff4d6d;border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.55;margin-bottom:16px}
  .challenge .reason-box{background:#fff;border-color:#2a1a1a}
  .reason-box strong{display:block;color:#ff4d6d;margin-bottom:6px;font-family:'Jua',sans-serif;font-size:14px;letter-spacing:.5px}
  .challenge .reason-box strong{color:#2a1a1a}
  .detail-link{display:inline-block;background:#2a1a1a;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px;font-family:'Jua',sans-serif;letter-spacing:1px;transition:transform .15s,box-shadow .15s;transform:translate(0,0);box-shadow:none}
  .challenge .detail-link{background:#ff4d6d}

  @media(max-width:480px){
    h1{font-size:30px}.q-text{font-size:21px}.position-image{height:220px}

<body>
<div class="container">

  <!-- 연령 게이트 -->
  <div id="ageGate" class="age-gate active">
    <div style="text-align:center">
      <span class="badge">19+ ONLY</span>
      <h1>[섹슐랭가이드]<br>오늘의 체위 추천</h1>
      <p class="subtitle">파트너와 함께 답하면, 오늘 밤 메뉴를 추천해 드려요 🍽️</p>
      <button class="btn" id="startBtn" onclick="startQuiz()">만 19세 이상입니다 → 시작하기</button>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div id="quiz" class="quiz">
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <p class="subtitle" style="margin-bottom:20px">파트너와 함께 솔직하게 답해 주세요!</p>
    <div id="questionArea"></div>
    <div class="nav-buttons">
      <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">← 이전</button>
      <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">다음 →</button>
    </div>
  </div>

  <!-- 로딩 -->
  <div id="loading" class="loading">
    <div class="loading-emoji" id="loadingEmoji">🤔</div>
    <div class="loading-title">섹슐랭 평가위원 회의 중...</div>
    <div class="loading-message" id="loadingMessage">두 분의 답변을 살펴보는 중...</div>
    <div class="loading-funny" id="loadingFunny">흠... 흠...</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- 결과 -->
  <div id="result" class="result">
    <div style="text-align:center;margin-bottom:24px">
      <span class="badge">추천 완료</span>
      <h1>두 분을 위한<br>오늘의 추천</h1>
      <p class="subtitle">두 분의 답변을 바탕으로 골라봤어요.</p>
    </div>
    <div id="resultArea"></div>
    <button class="btn" id="restartBtn" onclick="restart()">다시 추천받기 🔄</button>
  </div>

</div>

  {name:"플로팅 클로즈",detail:"수면 가까이 떠 있는 듯 부드럽게 결합",effect:"몽환적이고 명상적인 분위기",link:"https://tryme.im/266",image:"https://cdn.imweb.me/upload/S20240919cd452eb478454/2e4f6a8b1c3d5.png",tags:{mood:"명상",stim:"정서",energy:"저",lead:"균형",place:"욕실",contact:"높음"}},

  {name:"카우치 디핑",detail:"소파 등받이에 기대 새로운 각도로 결합",effect:"편안한 자세에서 색다른 자극",link:"https://tryme.im/263",image:"https://cdn.imweb.me/upload/S20240919cd452eb478454/5b7c9e2d4f6a8.png",tags:{mood:"신선",stim:"신체",energy:"중",lead:"균형",place:"어디든",contact:"중간"}},
  {name:"브레스 싱크",detail:"호흡을 맞춰 함께 움직이는 명상적 자세",effect:"깊은 일체감과 평온함",link:"https://tryme.im/262",image:"https://cdn.imweb.me/upload/S20240919cd452eb478454/6c8d1f3a5b7e9.png",tags:{mood:"명상",stim:"정서",energy:"저",lead:"균형",place:"침실",contact:"높음"}},
  {name:"애플바빙",detail:"손을 쓰지 않고 오직 입과 고개의 움직임으로만 진행",effect:"테크닉적 도전과 감각의 집중",link:"https://tryme.im/227",image:"https://cdn.imweb.me/upload/S20240919cd452eb478454/6f00ebb3473e5.jpg",tags:{mood:"명상",stim:"도전",energy:"중",lead:"균형",place:"침실",contact:"중간"}}
];

const questions = [
  {key:"mood",weight:2,q:"오늘 밤 우리가 원하는 분위기는?",opts:[
    {label:"🛋️ 포근하고 나른한 휴식 모드",val:"포근"},
    {label:"🔥 강렬하고 뜨겁게 타오르는",val:"강렬"},
    {label:"🧘 고요하고 깊이 연결되는",val:"명상"},
    {label:"✨ 신선하고 색다른 모험",val:"신선"}
  ]},
  {key:"stim",weight:2,q:"우리는 어떤 자극에 더 끌리나요?",opts:[
    {label:"👀 눈빛으로 통하는 정서적 교감",val:"정서"},
    {label:"💪 몸으로 느끼는 진한 쾌감",val:"신체"},
    {label:"🪞 보는 것만으로 흥분되는 시각",val:"시각"},
    {label:"🎯 새로운 테크닉 도전",val:"도전"}
  ]},
  {key:"energy",weight:1,q:"오늘 우리 컨디션은?",opts:[
    {label:"⚡ 둘 다 풀충전, 갈 데까지 가보자",val:"고"},
    {label:"🚶 적당히 활동적",val:"중"},
    {label:"😴 피곤해... 살살 가요",val:"저"}
  ]},
  {key:"lead",weight:1,q:"오늘 우리 사이 주도권은?",opts:[
    {label:"🎤 내가 리드할게요",val:"내가"},
    {label:"🎁 파트너가 리드해 줬으면",val:"파트너"},
    {label:"⚖️ 주거니 받거니 균형 있게",val:"균형"}
  ]},
  {key:"place",weight:1,q:"우리는 어디가 끌려요?",opts:[
    {label:"🛏️ 익숙하고 편안한 침실",val:"침실"},
    {label:"🚿 물 있는 곳 (욕실/욕조)",val:"욕실"},
    {label:"🌀 어디든 OK (소파, 거울 앞 등)",val:"어디든"}
  ]},
  {key:"contact",weight:1,q:"우리 밀착도는 어느 정도?",opts:[
    {label:"🍃 부드럽게 닿는 정도",val:"중간"},
    {label:"🫂 적당히 붙어서",val:"중간"},
    {label:"🔗 한 몸처럼 완전 밀착",val:"높음"}
  ]}
];

const labelMap = {
  mood:{포근:"포근하고 나른한",강렬:"강렬하고 뜨거운",명상:"고요하고 깊이 있는",신선:"신선하고 색다른"},
  stim:{정서:"정서적 교감",신체:"신체적 쾌감",시각:"시각적 자극",도전:"새로운 테크닉"},
  energy:{고:"에너지 충만",중:"적당한 활동성",저:"나른한 저체력"},
  lead:{내가:"내가 리드",파트너:"파트너가 리드",균형:"균형 있는 주도권"},
  place:{침실:"침실",욕실:"욕실/욕조",어디든:"어디든 OK"},
  contact:{중간:"적당한 밀착",높음:"완전 밀착"}
};

const loadingSteps = [
  {emoji:"🤔",msg:"두 분의 답변을 살펴보는 중...",funny:"흠... 흠..."},
  {emoji:"🔍",msg:"수많은 체위 중에서 고르는 중...",funny:"이것도... 저것도..."},
  {emoji:"🧠",msg:"두 분의 취향을 분석하는 중...",funny:"꽤 까다로우신데요?"},
  {emoji:"💡",msg:"찰떡 매칭 발견!",funny:"이거다"}
];

const moodComments = {
  포근:"오늘은 사랑이 이불 같네요.",
  강렬:"심호흡 하세요.",
  명상:"108배보다 효과 좋은 명상.",
  신선:"매너리즘? 그게 뭐죠?"
};

let currentQ = 0, answers = {};

// ===== 화면 전환 시 모든 포커스/잔상 제거 =====
function clearFocus(){
  if(document.activeElement && document.activeElement.blur){
    document.activeElement.blur();
  }
  // 모바일 Safari/Chrome의 hover sticky 문제 해결을 위한 강제 리플로우
  document.body.style.pointerEvents = 'none';
  requestAnimationFrame(()=>{
    document.body.style.pointerEvents = '';
  });
}

function startQuiz(){
  clearFocus();
  document.getElementById('ageGate').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion(){
  const q = questions[currentQ];
  const saved = answers[q.key];
  document.getElementById('questionArea').innerHTML = `
    <div class="question">
      <div class="q-num">Q${currentQ+1} / ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.opts.map(o=>`<button class="option ${saved===o.val?'selected':''}" data-val="${o.val}" onclick="selectOption(this)">${o.label}</button>`).join('')}
      </div>
    </div>`;
  document.getElementById('progressBar').style.width = `${(currentQ/questions.length)*100}%`;
  document.getElementById('prevBtn').disabled = currentQ === 0;
  updateNextButton();
}

function selectOption(btn){
  document.querySelectorAll('.option').forEach(o=>{
    o.classList.remove('selected');
    o.blur();
  });
  btn.classList.add('selected');
  answers[questions[currentQ].key] = btn.dataset.val;
  btn.blur();
  updateNextButton();
}

function updateNextButton(){
  const next = document.getElementById('nextBtn');
  next.disabled = !answers[questions[currentQ].key];
  next.textContent = currentQ === questions.length-1 ? '결과 보기 🎁' : '다음 →';
}

function nextQuestion(){
  if(!answers[questions[currentQ].key]) return;
  clearFocus();
  if(currentQ < questions.length-1){ currentQ++; renderQuestion(); }
  else { startLoading(); }
}

function prevQuestion(){
  clearFocus();
  if(currentQ > 0){ currentQ--; renderQuestion(); }
}

function startLoading(){
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('loading').classList.add('active');
  let step = 0;
  const emoji = document.getElementById('loadingEmoji');
  const msg = document.getElementById('loadingMessage');
  const funny = document.getElementById('loadingFunny');
  emoji.textContent = loadingSteps[0].emoji;
  msg.textContent = loadingSteps[0].msg;
  funny.textContent = loadingSteps[0].funny;
  const iv = setInterval(()=>{
    step++;
    if(step >= loadingSteps.length){ clearInterval(iv); setTimeout(showResult, 700); return; }
    msg.style.opacity = '0'; funny.style.opacity = '0';
    setTimeout(()=>{
      emoji.textContent = loadingSteps[step].emoji;
      msg.textContent = loadingSteps[step].msg;
      funny.textContent = loadingSteps[step].funny;
      msg.style.opacity = '1'; funny.style.opacity = '1';
    }, 200);
  }, 700);
}

function calculateScores(){
  return positions.map(p=>{
    let score = 0, matched = [];
    questions.forEach(q=>{
      if(p.tags[q.key] === answers[q.key]){ score += q.weight; matched.push(q.key); }
    });
    return {...p, score, matched};
  }).sort((a,b)=>b.score-a.score);
}

function buildRecommendReason(pos){
  if(pos.matched.length === 0) return "정확히 맞아떨어지진 않지만, 오늘 분위기에 가장 가까운 선택지예요.";
  const parts = [];
  if(pos.matched.includes('mood'))    parts.push(`'${labelMap.mood[answers.mood]}' 분위기`);
  if(pos.matched.includes('stim'))    parts.push(`'${labelMap.stim[answers.stim]}'을 원하는 마음`);
  if(pos.matched.includes('energy'))  parts.push(`'${labelMap.energy[answers.energy]}' 컨디션`);
  if(pos.matched.includes('lead'))    parts.push(`'${labelMap.lead[answers.lead]}' 흐름`);
  if(pos.matched.includes('place'))   parts.push(`'${labelMap.place[answers.place]}' 장소`);
  if(pos.matched.includes('contact')) parts.push(`'${labelMap.contact[answers.contact]}' 밀착도`);
  return `두 분이 고른 ${parts.slice(0,3).join(', ')}와(과) 정확히 맞아떨어집니다. 그래서 오늘 밤 우리 둘이 ${pos.effect.toLowerCase()}을(를) 가장 자연스럽게 경험할 수 있어요.`;
}

function buildChallengeReason(pos){
  const diffs = [];
  if(pos.tags.mood !== answers.mood)
    diffs.push(`평소 우리가 '${labelMap.mood[answers.mood]}' 분위기를 골랐다면, 오늘은 '${labelMap.mood[pos.tags.mood]}' 무드로 같이 가보는 거예요`);
  if(pos.tags.stim !== answers.stim)
    diffs.push(`'${labelMap.stim[answers.stim]}' 대신 '${labelMap.stim[pos.tags.stim]}'에 함께 집중해 보는 거죠`);
  if(pos.tags.lead !== answers.lead && pos.tags.lead !== '균형')
    diffs.push(`주도권도 '${labelMap.lead[pos.tags.lead]}'로 살짝 바꿔서`);
  if(pos.tags.place !== answers.place && pos.tags.place !== '어디든')
    diffs.push(`장소를 '${labelMap.place[pos.tags.place]}'로 옮겨서`);
  const core = diffs.length ? diffs.slice(0,2).join(', ') + '.' : '안전지대에서 한 발만 같이 벗어나 보는 시도예요.';
  return `${core} 익숙함이 주는 안정감도 좋지만, 가끔 우리가 다른 방향을 시도하면 ${pos.effect.toLowerCase()}이라는 새로운 발견이 따라와요. 안 맞으면 다음에 안 하면 그만, 손해 볼 거 없잖아요?`;
}

function showResult(){
  clearFocus();
  document.getElementById('loading').classList.remove('active');
  document.getElementById('result').classList.add('active');
  const scored = calculateScores();
  const top = scored[0];
  const pool = scored.slice(-8).filter(p=>p.name !== top.name);
  const challenge = pool[Math.floor(Math.random()*pool.length)];
  const comment = moodComments[answers.mood] || "오늘도 두 분 평화로운 밤 되세요.";
  document.getElementById('resultArea').innerHTML = `
    <div class="result-main">
      <div class="position-image"><img src="${top.image}" alt="${top.name}" onerror="this.parentElement.style.display='none'"></div>
      <div class="card-title-area">
        <span class="result-tag">💖 오늘 우리의 추천</span>
        <h2>${top.name}</h2>
        <p class="card-comment">${comment}</p>
      </div>
      <p class="result-detail">${top.detail}</p>
      <div class="reason-box"><strong>👉 왜 두분에게 이걸 추천하냐면요</strong>${buildRecommendReason(top)}</div>
      <a href="${top.link}" target="_blank" rel="noopener" class="detail-link">📖 자세히 보러 가기 →</a>
    </div>
    <div class="challenge">
      <div class="position-image"><img src="${challenge.image}" alt="${challenge.name}" onerror="this.parentElement.style.display='none'"></div>
      <div class="card-title-area">
        <span class="result-tag">🎲 우리의 오늘 도전</span>
        <h2>${challenge.name}</h2>
        <p class="card-comment">안전지대 밖에서 만나는 색다른 자극.</p>
      </div>
      <p class="result-detail">${challenge.detail}</p>
      <div class="reason-box"><strong>👉 우리가 왜 도전해 볼 만하냐면요</strong>${buildChallengeReason(challenge)}</div>
      <a href="${challenge.link}" target="_blank" rel="noopener" class="detail-link">📖 자세히 보러 가기 →</a>
    </div>`;
}

function restart(){
  clearFocus();
  currentQ = 0; answers = {};
  document.getElementById('result').classList.remove('active');
  document.getElementById('loading').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}
</script>
