  }

    overflow: hidden;
    border: 2px solid #2a1a1a;

    border-radius: 12px;
    font-size: 16px;

  }

    font-family: 'Black Han Sans', 'Jua', sans-serif;

    color: #2a1a1a;

    text-shadow: 3px 3px 0 #ffc8d1;

    color: #ff4d6d;
    margin-bottom: 30px;

    margin-bottom: 20px;
  }

    width: 16px;
    height: 16px;
    background: #ff4d6d;
    border: 2px solid #2a1a1a;
    border-radius: 50%;
    animation: dotPulse 1.2s ease-in-out infinite;

  .loading-dot:nth-child(3) { animation-delay: 0.4s; background: #2a1a1a; }

</div>

    link:"https://tryme.im/227", image:"https://cdn.imweb.me/upload/S20240919cd452eb478454/6f00ebb3473e5.jpg",
    tags:{mood:"명상",stim:"도전",energy:"중",lead:"균형",place:"침실",contact:"중간"} }
];

const questions = [
  { key:"mood", weight:2, q:"오늘 밤 원하는 분위기는?",
    opts:[
      {label:"🛋️ 포근하고 나른한 휴식 모드", val:"포근"},
      {label:"🔥 강렬하고 뜨겁게 타오르는", val:"강렬"},
      {label:"🧘 고요하고 깊이 연결되는", val:"명상"},
      {label:"✨ 신선하고 색다른 모험", val:"신선"}
    ]},
  { key:"stim", weight:2, q:"어떤 자극에 더 끌리나요?",
    opts:[
      {label:"👀 눈빛으로 통하는 정서적 교감", val:"정서"},
      {label:"💪 몸으로 느끼는 진한 쾌감", val:"신체"},
      {label:"🪞 보는 것만으로 흥분되는 시각", val:"시각"},
      {label:"🎯 새로운 테크닉 도전", val:"도전"}
    ]},
  { key:"energy", weight:1, q:"두 사람 오늘 컨디션은?",
    opts:[
      {label:"⚡ 에너지 풀충전, 갈 데까지 가보자", val:"고"},
      {label:"🚶 적당히 활동적", val:"중"},
      {label:"😴 피곤해... 살살 부탁해요", val:"저"}
    ]},
  { key:"lead", weight:1, q:"오늘 주도권은 누가?",
    opts:[
      {label:"🎤 내가 리드할게요", val:"내가"},
      {label:"🎁 파트너가 리드해 줬으면", val:"파트너"},
      {label:"⚖️ 주거니 받거니 균형 있게", val:"균형"}
    ]},
  { key:"place", weight:1, q:"장소는 어디가 끌려요?",
    opts:[
      {label:"🛏️ 익숙하고 편안한 침실", val:"침실"},
      {label:"🚿 물 있는 곳 (욕실/욕조)", val:"욕실"},
      {label:"🌀 어디든 OK (소파, 거울 앞 등)", val:"어디든"}
    ]},
  { key:"contact", weight:1, q:"밀착도는 어느 정도?",
    opts:[
      {label:"🍃 부드럽게 닿는 정도", val:"중간"},
      {label:"🫂 적당히 붙어서", val:"중간"},
      {label:"🔗 한 몸처럼 완전 밀착", val:"높음"}
    ]}
];

const labelMap = {
  mood:    { "포근":"포근하고 나른한", "강렬":"강렬하고 뜨거운", "명상":"고요하고 깊이 있는", "신선":"신선하고 색다른" },
  stim:    { "정서":"정서적 교감", "신체":"신체적 쾌감", "시각":"시각적 자극", "도전":"새로운 테크닉" },
  energy:  { "고":"에너지 충만", "중":"적당한 활동성", "저":"나른한 저체력" },
  lead:    { "내가":"내가 리드", "파트너":"파트너가 리드", "균형":"균형 있는 주도권" },
  place:   { "침실":"침실", "욕실":"욕실/욕조", "어디든":"어디든 OK" },
  contact: { "중간":"적당한 밀착", "높음":"완전 밀착" }
};

// ============ 로딩 메시지 시퀀스 ============
const loadingSteps = [
  { emoji: "🤔", msg: "당신의 답변을 살펴보는 중...",   funny: "흠... 흠..." },
  { emoji: "🔍", msg: "수많은 체위 중에서 고르는 중...", funny: "이것도... 저것도... 음..." },
  { emoji: "🧠", msg: "취향을 분석하는 중...",          funny: "꽤 까다로우신데요?" },
  { emoji: "💡", msg: "찰떡 매칭 발견!",                funny: "이거다 싶은 게 나왔어요." }
];

let currentQ = 0;
let answers = {};
let locked = false;

function startQuiz() {
  document.getElementById('ageGate').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}

function renderQuestion() {
  locked = false;
  const q = questions[currentQ];
  const area = document.getElementById('questionArea');
  area.innerHTML = `
    <div class="question">
      <div class="q-num">Q${currentQ+1} / ${questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.opts.map(o => `<button class="option" data-val="${o.val}" onclick="selectOption(this)">${o.label}</button>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('progressBar').style.width = `${(currentQ/questions.length)*100}%`;
}

function selectOption(btn) {
  if (locked) return;
  locked = true;
  document.querySelectorAll('.option').forEach(o => {
    o.classList.remove('selected');
    o.disabled = true;
  });
  btn.classList.add('selected');
  answers[questions[currentQ].key] = btn.dataset.val;

  setTimeout(() => {
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      startLoading();
    }
  }, 350);
}

// ============ 로딩 시퀀스 실행 ============
function startLoading() {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('loading').classList.add('active');

  const emojiEl = document.getElementById('loadingEmoji');
  const msgEl = document.getElementById('loadingMessage');
  const funnyEl = document.getElementById('loadingFunny');

  let step = 0;
  // 첫 번째 메시지 즉시 표시
  emojiEl.textContent = loadingSteps[0].emoji;
  msgEl.textContent = loadingSteps[0].msg;
  funnyEl.textContent = loadingSteps[0].funny;

  const interval = setInterval(() => {
    step++;
    if (step >= loadingSteps.length) {
      clearInterval(interval);
      // 마지막 메시지 잠깐 보여준 뒤 결과로 이동
      setTimeout(showResult, 700);
      return;
    }
    // 페이드 효과
    msgEl.style.opacity = '0';
    funnyEl.style.opacity = '0';
    setTimeout(() => {
      emojiEl.textContent = loadingSteps[step].emoji;
      msgEl.textContent = loadingSteps[step].msg;
      funnyEl.textContent = loadingSteps[step].funny;
      msgEl.style.opacity = '1';
      funnyEl.style.opacity = '1';
    }, 200);
  }, 700);
}

function calculateScores() {
  return positions.map(p => {
    let score = 0;
    let matched = [];
    questions.forEach(q => {
      if (p.tags[q.key] === answers[q.key]) {
        score += q.weight;
        matched.push(q.key);
      }
    });
    return { ...p, score, matched };
  }).sort((a,b) => b.score - a.score);
}

function buildRecommendReason(position) {
  const matched = position.matched;
  if (matched.length === 0) {
    return "정확히 맞아떨어지진 않지만, 오늘 분위기에 가장 가까운 선택지예요.";
  }
  const parts = [];
  if (matched.includes("mood")) parts.push(`'${labelMap.mood[answers.mood]}' 분위기`);
  if (matched.includes("stim")) parts.push(`'${labelMap.stim[answers.stim]}'을 원하는 마음`);
  if (matched.includes("energy")) parts.push(`'${labelMap.energy[answers.energy]}' 컨디션`);
  if (matched.includes("lead")) parts.push(`'${labelMap.lead[answers.lead]}' 흐름`);
  if (matched.includes("place")) parts.push(`'${labelMap.place[answers.place]}' 장소`);
  if (matched.includes("contact")) parts.push(`'${labelMap.contact[answers.contact]}' 밀착도`);

  const matchedStr = parts.slice(0, 3).join(", ");
  return `당신이 고른 ${matchedStr}와(과) 정확히 맞아떨어집니다. 그래서 오늘 밤 ${position.effect.toLowerCase()}을(를) 가장 자연스럽게 경험할 수 있어요.`;
}

function buildChallengeReason(position) {
  const diffs = [];
  if (position.tags.mood !== answers.mood) {
    diffs.push(`평소 '${labelMap.mood[answers.mood]}' 분위기를 골랐다면, 오늘은 '${labelMap.mood[position.tags.mood]}' 무드로 한 번 가보는 거예요`);
  }
  if (position.tags.stim !== answers.stim) {
    diffs.push(`'${labelMap.stim[answers.stim]}' 대신 '${labelMap.stim[position.tags.stim]}'에 집중해 보는 거죠`);
  }
  if (position.tags.lead !== answers.lead && position.tags.lead !== "균형") {
    diffs.push(`주도권도 '${labelMap.lead[position.tags.lead]}'로 살짝 바꿔서`);
  }
  if (position.tags.place !== answers.place && position.tags.place !== "어디든") {
    diffs.push(`장소를 '${labelMap.place[position.tags.place]}'로 옮겨서`);
  }

  const reasonCore = diffs.length > 0
    ? diffs.slice(0, 2).join(", ") + "."
    : "안전지대에서 한 발만 벗어나 보는 시도예요.";

  return `${reasonCore} 익숙함이 주는 안정감도 좋지만, 가끔 다른 방향을 시도하면 ${position.effect.toLowerCase()}이라는 새로운 발견이 따라와요. 안 맞으면 다음에 안 하면 그만, 손해 볼 거 없잖아요?`;
}

const moodComments = {
  "포근": "오늘은 사랑이 이불 같네요. 폭 덮어드릴게요.",
  "강렬": "심호흡 하세요. 출발합니다.",
  "명상": "108배보다 효과 좋은 명상, 여기 있습니다.",
  "신선": "매너리즘? 그게 뭐죠 먹는 건가요?"
};

function showResult() {
  document.getElementById('loading').classList.remove('active');
  document.getElementById('result').classList.add('active');

  const scored = calculateScores();
  const top = scored[0];

  const challengePool = scored.slice(-8).filter(p => p.name !== top.name);
  const challenge = challengePool[Math.floor(Math.random() * challengePool.length)];

  const comment = moodComments[answers.mood] || "오늘도 평화로운 밤 되세요.";
  const recReason = buildRecommendReason(top);
  const chalReason = buildChallengeReason(challenge);

  document.getElementById('resultArea').innerHTML = `
    <div class="result-main">
      <div class="card-header">
        <div class="position-image">
          <img src="${top.image}" alt="${top.name}" onerror="this.parentElement.style.display='none'">
        </div>
        <div class="card-header-text">
          <span class="result-tag">💖 오늘의 추천</span>
          <h2>${top.name}</h2>
          <p class="card-comment">${comment}</p>
        </div>
      </div>
      <p class="result-detail">${top.detail}</p>
      <div class="reason-box">
        <strong>👉 왜 이걸 추천하냐면요</strong>
        ${recReason}
      </div>
      <a href="${top.link}" target="_blank" rel="noopener" class="detail-link">📖 자세히 보러 가기 →</a>
    </div>

    <div class="challenge">
      <div class="card-header">
        <div class="position-image">
          <img src="${challenge.image}" alt="${challenge.name}" onerror="this.parentElement.style.display='none'">
        </div>
        <div class="card-header-text">
          <span class="result-tag">🎲 오늘의 도전</span>
          <h2>${challenge.name}</h2>
          <p class="card-comment">안전지대 밖에서 만나는 색다른 자극.</p>
        </div>
      </div>
      <p class="result-detail">${challenge.detail}</p>
      <div class="reason-box">
        <strong>👉 왜 도전해 볼 만하냐면요</strong>
        ${chalReason}
      </div>
      <a href="${challenge.link}" target="_blank" rel="noopener" class="detail-link">📖 자세히 보러 가기 →</a>
    </div>
  `;
}

function restart() {
  currentQ = 0;
  answers = {};
  locked = false;
  document.getElementById('result').classList.remove('active');
  document.getElementById('loading').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
}
</script>
